syntax = "proto3";

option go_package = "./proto";

// ─── NextInvocation ───────────────────────────────────────────────────────────

message NextInvocationRequest {
    bytes instance_id = 1;
    bytes auth_token = 2;
}

message NextInvocationResponse {
    bytes function_id = 1;
    bytes task_id = 2;
    bytes trigger_id = 3;
    string event_type = 4;
    int64 timestamp = 5;
    bytes payload = 6;
}

message TaskResponseRequest {
    bytes task_id = 1;
    bytes instance_id = 4;
    bytes auth_token = 5;
    bytes payload = 6;
}

message TaskResponseResponse {}

service ContainerAPIService {
    rpc NextInvocation(NextInvocationRequest) returns (NextInvocationResponse) {}
    rpc TaskResponse(TaskResponseRequest) returns (TaskResponseResponse) {}
}
